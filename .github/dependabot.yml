version: 2
updates:
  # Three direct dependencies, so a monthly cadence is plenty and avoids noise.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      cargo:
        patterns: ["*"]

  # Actions are pinned to immutable commit SHAs so a compromised tag cannot
  # silently change what runs in CI. Dependabot is what keeps those SHAs from
  # rotting: it bumps them and updates the trailing version comment.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
